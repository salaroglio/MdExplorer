<div class="title-bar">
  <div class="app-info">
    <img src="/assets/MdIcon.png" alt="MdExplorer" class="app-icon">
    <span class="app-title">{{ 'TITLE_BAR.APP_NAME' | translate }}</span>
    <span class="app-version">v{{ version }}</span>
  </div>
  
  <div class="navigation-controls" *ngIf="isProjectOpened">
    <button mat-icon-button
            (click)="backward()"
            [disabled]="navService.navigationGhost.length <= 1"
            class="nav-button">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <button mat-icon-button
            (click)="forward()"
            [disabled]="navService.navigation.length == navService.navigationGhost.length"
            class="nav-button">
      <mat-icon>arrow_forward</mat-icon>
    </button>
  </div>

  <app-search-box *ngIf="isProjectOpened"></app-search-box>

  <app-compatibility-mode-badge *ngIf="isProjectOpened"></app-compatibility-mode-badge>

  <app-participant-gems *ngIf="isProjectOpened && teamParticipants?.length > 0"
                        class="title-bar-gems"
                        size="medium"
                        [participants]="teamParticipants"
                        [currentUserEmail]="teamCurrentUserEmail"
                        [maxVisible]="5">
  </app-participant-gems>

  <div class="drag-region">
    <div class="welcome-message" *ngIf="isProjectsPage && !ragIndexing">
      <span class="welcome-text">{{ 'TITLE_BAR.WELCOME' | translate }}</span>
      <span class="welcome-subtitle">{{ 'TITLE_BAR.SUBTITLE' | translate }}</span>
    </div>
    <div class="rag-indexing-indicator" *ngIf="ragIndexing">
      <mat-icon class="rag-icon spinning">memory</mat-icon>
      <span class="rag-text">{{ 'TITLE_BAR.RAG_INDEXING' | translate }}</span>
      <span class="rag-progress" *ngIf="ragTotal > 0">{{ ragProcessed }}/{{ ragTotal }}</span>
      <div class="rag-progress-bar" *ngIf="ragTotal > 0">
        <div class="rag-progress-fill" [style.width.%]="ragProgressPercent"></div>
      </div>
      <span class="rag-message" *ngIf="ragMessage">{{ ragMessage }}</span>
    </div>
  </div>

  <button mat-icon-button
          (click)="launchMarkAssistant()"
          [matTooltip]="'TITLE_BAR.MARK_ASSISTANT_TOOLTIP' | translate"
          class="mark-help-trigger">
    <mat-icon>help_outline</mat-icon>
  </button>

  <button mat-icon-button [matMenuTriggerFor]="settingsMenu" class="settings-trigger">
    <mat-icon>settings</mat-icon>
  </button>

  <mat-menu #settingsMenu="matMenu">
    <button mat-menu-item (click)="openSettings('application')">
      <mat-icon>build</mat-icon>
      <span>{{ 'TITLE_BAR.APPLICATION' | translate }}</span>
    </button>
    <button mat-menu-item (click)="openSettings('ai')">
      <mat-icon>smart_toy</mat-icon>
      <span>{{ 'TITLE_BAR.AI_MODELS' | translate }}</span>
    </button>
    <button mat-menu-item (click)="openSettings('embedding')">
      <mat-icon>hub</mat-icon>
      <span>{{ 'TITLE_BAR.EMBEDDING' | translate }}</span>
    </button>
    <button mat-menu-item (click)="openAppStoreSettings()">
      <mat-icon>storefront</mat-icon>
      <span>{{ 'TITLE_BAR.APP_STORE_SETTINGS' | translate }}</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="navigateToProjects()">
      <mat-icon>folder_open</mat-icon>
      <span>{{ 'TITLE_BAR.PROJECTS' | translate }}</span>
    </button>
    <button mat-menu-item (click)="navigateToAppStore()">
      <mat-icon>storefront</mat-icon>
      <span>{{ 'TITLE_BAR.APP_STORE' | translate }}</span>
    </button>
  </mat-menu>

  <div class="window-controls" *ngIf="isElectron">
    <button mat-icon-button (click)="minimizeWindow()" class="window-control">
      <mat-icon>remove</mat-icon>
    </button>
    <button mat-icon-button (click)="maximizeWindow()" class="window-control">
      <mat-icon>crop_square</mat-icon>
    </button>
    <button mat-icon-button (click)="closeWindow()" class="window-control close-button">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</div>
