<div class="title-bar">
  <div class="app-info">
    <img src="/assets/MdIcon.png" alt="MdExplorer" class="app-icon">
    <span class="app-title">MdExplorer</span>
    <span class="app-version">v{{ version }}</span>
  </div>
  
  <div class="navigation-controls" *ngIf="isSidenavOpen && isProjectOpened">
    <button mat-icon-button
            (click)="backward()"
            [disabled]="navService.navigationGhost.length <= 1"
            class="nav-button">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <button mat-icon-button
            (click)="forward()"
            [disabled]="navService.navigation.length == navService.navigationGhost.length"
            class="nav-button">
      <mat-icon>arrow_forward</mat-icon>
    </button>
  </div>

  <app-search-box *ngIf="isProjectOpened"></app-search-box>

  <app-compatibility-mode-badge *ngIf="isProjectOpened"></app-compatibility-mode-badge>

  <div class="drag-region">
    <div class="welcome-message" *ngIf="isProjectsPage">
      <span class="welcome-text">Welcome to MdExplorer</span>
      <span class="welcome-subtitle">Your markdown documentation workspace</span>
    </div>
  </div>
  
  <div class="window-controls" *ngIf="isElectron">
    <button mat-icon-button (click)="minimizeWindow()" class="window-control">
      <mat-icon>remove</mat-icon>
    </button>
    <button mat-icon-button (click)="maximizeWindow()" class="window-control">
      <mat-icon>crop_square</mat-icon>
    </button>
    <button mat-icon-button (click)="closeWindow()" class="window-control close-button">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</div>
