<div mat-dialog-title class="dialog-header">
  <mat-icon class="dialog-icon">create_new_folder</mat-icon>
  <span>Create New Folder</span>
</div>

<mat-dialog-content>
  <div class="dialog-container">
    <!-- Context info -->
    <div class="context-info">
      <mat-icon class="context-icon">info</mat-icon>
      <div class="context-text">
        <strong>Parent folder:</strong> {{getParentName()}}
        <div class="context-path">{{fullPathPreview}}</div>
      </div>
    </div>

    <!-- Input field -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Folder Name</mat-label>
      <input matInput
             [(ngModel)]="directoryName"
             (keyup.enter)="save()"
             [disabled]="isCreating"
             placeholder="Enter folder name"
             #nameInput
             autofocus>
      <mat-icon matPrefix>folder</mat-icon>
      <mat-hint *ngIf="!errorMessage">Press Enter to create</mat-hint>
      <mat-error *ngIf="errorMessage">{{errorMessage}}</mat-error>
    </mat-form-field>

    <!-- Preview del path completo -->
    <div class="path-preview" *ngIf="directoryName && isValidName()">
      <mat-icon class="preview-icon">visibility</mat-icon>
      <div class="preview-content">
        <div class="preview-label">Will be created at:</div>
        <div class="preview-path">{{fullPathPreview}}</div>
      </div>
    </div>

    <!-- Quick suggestions -->
    <div class="suggestions" *ngIf="!directoryName && suggestions.length > 0">
      <div class="suggestions-label">Quick suggestions:</div>
      <div class="suggestions-chips">
        <mat-chip *ngFor="let suggestion of suggestions"
                  (click)="applySuggestion(suggestion)"
                  class="suggestion-chip">
          <mat-icon>add</mat-icon>
          {{suggestion}}
        </mat-chip>
      </div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button
          (click)="dismiss()"
          [disabled]="isCreating">
    <mat-icon>cancel</mat-icon>
    Cancel
  </button>
  <button mat-raised-button
          color="primary"
          (click)="save()"
          [disabled]="!isValidName() || isCreating">
    <mat-spinner diameter="20" *ngIf="isCreating" class="button-spinner"></mat-spinner>
    <mat-icon *ngIf="!isCreating">save</mat-icon>
    {{isCreating ? 'Creating...' : 'Create Folder'}}
  </button>
</mat-dialog-actions>
