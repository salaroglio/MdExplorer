<div class="doc-template" [class.collapsed]="collapsed">
  <!-- Header -->
  <div class="doc-template-header">
    <span class="doc-icon">&#128196;</span>
    <span class="doc-name">{{ templateName }}</span>
    <span class="spacer"></span>
    <span class="doc-status">
      <span class="count">{{ cards.length }}</span> prompt
    </span>
    <button class="collapse-btn" (click)="toggleCollapse()">&#9660;</button>
  </div>

  <!-- Body -->
  <div class="doc-template-body" *ngIf="!collapsed">
    <div *ngIf="cards.length === 0" class="empty-slots">
      Nessuno slot. Aggiungi card alla sessione.
    </div>

    <div *ngFor="let card of cards; let i = index"
         class="doc-prompt-slot">
      <span class="slot-number">{{ i + 1 }}</span>
      <div class="slot-content">
        <div class="slot-title">
          <span class="card-link">{{ card.generatedTitle || 'Card ' + (i + 1) }}</span>
        </div>
        <div class="slot-prompt">{{ card.distilledPrompt || '(prompt vuoto)' }}</div>
      </div>
      <span class="slot-arrow">&#9654;</span>
    </div>
  </div>
</div>
