
<div class="rule-dialog">
  <div class="dialog-header">
    <mat-icon class="header-icon">edit_note</mat-icon>
    <div class="header-text">
      <h3 class="dialog-title">{{ 'SIGNALR.FILE_RENAME_SUGGESTION' | translate }}</h3>
      <p class="dialog-subtitle">{{message}}</p>
    </div>
  </div>

  <div class="dialog-content">
    <!-- Error message -->
    <div *ngIf="hasError" class="error-message">
      <mat-icon class="error-icon">error_outline</mat-icon>
      <span class="error-text">{{errorMessage}}</span>
    </div>

    <div class="file-comparison">
      <div class="file-row">
        <span class="file-label">{{ 'SIGNALR.CURRENT' | translate }}</span>
        <code class="filename current">{{fromFileName}}</code>
      </div>
      
      <div class="file-row">
        <span class="file-label">{{ 'SIGNALR.SUGGESTED' | translate }}</span>
        <code class="filename suggested">{{toFileName}}</code>
      </div>
    </div>
  </div>

  <div class="dialog-actions">
    <button mat-button 
            class="action-btn secondary"
            [disabled]="isProcessing"
            (click)="dismiss()">
      {{ hasError ? ('COMMON.CANCEL' | translate) : ('SIGNALR.KEEP_CURRENT' | translate) }}
    </button>
    
    <button *ngIf="!hasError"
            mat-flat-button 
            color="primary"
            class="action-btn primary"
            [disabled]="isProcessing"
            (click)="changeName()">
      <mat-spinner *ngIf="isProcessing" diameter="16"></mat-spinner>
      <span *ngIf="!isProcessing">{{ 'SIGNALR.APPLY_SUGGESTION' | translate }}</span>
      <span *ngIf="isProcessing">{{ 'SIGNALR.APPLYING' | translate }}</span>
    </button>
    
    <button *ngIf="hasError"
            mat-flat-button 
            color="warn"
            class="action-btn retry"
            [disabled]="isProcessing"
            (click)="retryRename()">
      <mat-icon>refresh</mat-icon>
      <span>{{ 'GIT_BRANCH.RETRY' | translate }}</span>
    </button>
  </div>
</div>
