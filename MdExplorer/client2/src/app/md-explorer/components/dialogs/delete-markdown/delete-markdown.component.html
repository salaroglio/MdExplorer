<div mat-dialog-title>
   {{ 'DELETE_MARKDOWN.TITLE' | translate }}
</div>
<mat-dialog-content>
  {{ 'DELETE_MARKDOWN.NO_DEPS' | translate }}
</mat-dialog-content>
<mat-dialog-actions>
