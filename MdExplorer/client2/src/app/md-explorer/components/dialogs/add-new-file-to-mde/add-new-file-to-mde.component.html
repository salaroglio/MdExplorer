<p>{{ 'ADD_FILE.TITLE' | translate }}</p>



<mat-dialog-content>
  <div class="simple-container">
    <mat-form-field appearance="outline" style="width:500px;">
      <input matInput [(ngModel)]="fullPath" [placeholder]="'ADD_FILE.PLACEHOLDER' | translate">
      <mat-hint>{{ 'ADD_FILE.HINT' | translate }}</mat-hint>
      <button mat-button matSuffix color="primary" (click)="openFileSystem()"><mat-icon>more_horiz</mat-icon> </button>

    </mat-form-field>

    <!-- Lista dei file selezionati (multiselezione) -->
    <div class="selected-files" *ngIf="selectedPaths.length > 1">
      <div class="selected-files-header">
        {{ 'ADD_FILE.SELECTED_FILES_HEADER' | translate:{ count: selectedPaths.length } }}
      </div>
      <div class="selected-file-row" *ngFor="let p of selectedPaths; let i = index">
        <mat-icon class="selected-file-icon">insert_drive_file</mat-icon>
        <span class="selected-file-path" [matTooltip]="p">{{ p }}</span>
        <button mat-icon-button (click)="removeSelected(i)">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>
  </div>

</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button color="primary" (click)="add()">
    <mat-icon>add</mat-icon>{{ 'ADD_FILE.ADD_BTN' | translate }}
  </button>
  <button mat-button color="primary" (click)="dismiss()">
    <mat-icon>cancel</mat-icon>{{ 'COMMON.CANCEL' | translate }}
  </button>
</mat-dialog-actions>
