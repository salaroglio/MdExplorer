<p>{{ 'ADD_FILE.TITLE' | translate }}</p>



<mat-dialog-content>
  <div class="simple-container">
    <mat-form-field appearance="outline" style="width:500px;">
      <input matInput [(ngModel)]="fullPath" [placeholder]="'ADD_FILE.PLACEHOLDER' | translate" required>
      <mat-hint>{{ 'ADD_FILE.HINT' | translate }}</mat-hint>
      <button mat-button matSuffix color="primary" (click)="openFileSystem()"><mat-icon>more_horiz</mat-icon> </button>

    </mat-form-field>
  </div>

</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button color="primary" (click)="add()">
    <mat-icon>add</mat-icon>{{ 'ADD_FILE.ADD_BTN' | translate }}
  </button>
  <button mat-button color="primary" (click)="dismiss()">
    <mat-icon>cancel</mat-icon>{{ 'COMMON.CANCEL' | translate }}
  </button>
</mat-dialog-actions>
