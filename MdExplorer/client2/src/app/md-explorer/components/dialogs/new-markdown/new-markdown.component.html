<div class="dialog-container">
  <div class="dialog-header">
    <span class="dialog-title">New document</span>
  </div>

  <div class="dialog-body">
    <div class="form-group">
      <label class="form-label" for="docTitle">Title</label>
      <input class="form-input"
             id="docTitle"
             type="text"
             [(ngModel)]="markdownTitle"
             (keyup.enter)="save()"
             placeholder="Document title"
             autofocus />
    </div>

    <div class="form-group">
      <label class="form-label">Type</label>
      <div class="radio-group">
        <label class="radio-item" *ngFor="let docType of documentTypes"
               [class.selected]="selectedTemplate === docType">
          <input type="radio"
                 name="documentType"
                 [value]="docType"
                 [(ngModel)]="selectedTemplate" />
          <span class="radio-label">{{ docType.name }}</span>
        </label>
      </div>
    </div>
  </div>

  <div class="dialog-footer">
    <button class="btn btn-primary" (click)="save()" [disabled]="!markdownTitle?.trim()">Save</button>
    <button class="btn btn-secondary" (click)="dismiss()">Cancel</button>
  </div>
</div>
