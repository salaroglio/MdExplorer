<mat-toolbar color="primary">
  <mat-toolbar-row>
    <button mat-icon-button matTooltip="hide/show menu" (click)="toggleSidenav()">
      <mat-icon>vertical_split</mat-icon>
    </button>
    <button mat-icon-button matTooltip="edit document" (click)="OpenEditor()">
      <mat-icon>edit</mat-icon>
    </button>
    <button mat-icon-button matTooltip="export in word" (click)="Export()">
      <mat-icon>directions</mat-icon>
    </button>
    <button mat-icon-button matTooltip="Bookmarks" (click)="bookmarkToggle()">
      <mat-icon>bookmark</mat-icon>
    </button>
    <button mat-icon-button matTooltip="Open React Editor" (click)="openReactEditor()">
      <mat-icon>article</mat-icon>
    </button>
    <button *ngIf="isTocDirectoryFile()" mat-icon-button matTooltip="Aggiorna TOC con AI" (click)="refreshTocDirectory()">
      <mat-icon>refresh</mat-icon>
    </button>
    <span>{{currentMdFile?.name}}</span>


    <span class="flexExpand"></span>
    <button *ngIf="isGitRepository && !connectionIsActive" mat-icon-button matTooltip="missing connection to remote" (click)="checkConnection()">
      <mat-icon style="color:yellow">warning</mat-icon>
    </button>
    <span *ngIf="isGitRepository && isCheckingConnection"><img src="/assets/connecting.gif" /></span>

    <!-- Git button for NON-Git projects -->
    <span *ngIf="!isGitRepository" style="display:flex; flex-direction:row">
      <button mat-button [matMenuTriggerFor]="gitInitMenu" style="color: white;">
        <mat-icon>settings</mat-icon>
        Git <img src="/assets/gitlogo.png" style="height: 16px; margin-left: 4px;" />
      </button>
    </span>

    <span style="display:flex; flex-direction:row" *ngIf="currentBranch && currentBranch.length > 0">
      <div style="display:flex; flex-direction:column">
        <!-- Commit button with hover panel -->
        <div class="commit-menu-container" *ngIf="somethingIsChangedInTheBranch">
          <button class="smallMessagesToCommit"
                  (click)="commit()"
                  (mouseenter)="showCommitMenu=true; loadChangedFiles()">
            {{howManyFilesAreToCommit}} to commit
          </button>
          <div class="commit-menu"
               *ngIf="showCommitMenu"
               (mouseleave)="showCommitMenu=false">
            <div class="commit-menu-header">File da committare</div>
            <div *ngIf="isLoadingChangedFiles" class="commit-menu-loading">
              Caricamento...
            </div>
            <div *ngIf="!isLoadingChangedFiles && changedFiles.length > 0" class="commit-files-list">
              <div *ngFor="let file of changedFiles" class="commit-file-row">
                <span class="file-status" [ngClass]="file.status.toLowerCase()">
                  {{file.status}}
                </span>
                <span class="file-name" [title]="file.relativePath">
                  {{file.fileName}}
                </span>
                <span class="file-action">
                  <button mat-icon-button
                          class="rollback-btn"
                          (click)="discardFile(file); $event.stopPropagation()"
                          [matTooltip]="file.isNew ? 'Rimuovi da staging' : 'Scarta modifiche'">
                    <mat-icon>{{file.isNew ? 'remove_circle_outline' : 'undo'}}</mat-icon>
                  </button>
                </span>
              </div>
            </div>
            <div *ngIf="!isLoadingChangedFiles && changedFiles.length === 0" class="commit-menu-empty">
              Nessun file modificato
            </div>
          </div>
        </div>

        <!-- Pull button with hover panel -->
        <div class="menu-container">
          <button class="smallMessagesToPull" (click)="pull()"
                  (mouseover)="showMenu=true"
                  *ngIf="somethingIsToPull">
            {{howManyFilesAreToPull}} to pull
          </button>
          <div class="menu" *ngIf="showMenu" (mouseleave)="showMenu=false">
              <table>
                <tr *ngFor="let fileAndAuthor of filesAndAuthors"><td style="color:blue;">{{fileAndAuthor.author}}</td><td>{{fileAndAuthor.fileName}}</td></tr>
              </table>
          </div>
        </div>
        <button class="smallMessagesToPush" (click)="push()" *ngIf="somethingIsToPush">{{howManyCommitAreToPush}} to push</button>
      </div>
      <button mat-button [matMenuTriggerFor]="tagsAndBranches"
              [ngClass]="!somethingIsChangedInTheBranch? 'branchGood':'branchToCommit'">
        [{{currentBranch}}] <img src="/assets/gitlogo.png" />
      </button>
    </span>

  </mat-toolbar-row>
</mat-toolbar>
<!--[matMenuTriggerFor]="FileAndAutorsToPull"
#menuTrigger="matMenuTrigger"
 (mouseenter)="openMenu(menuTrigger)"
 (mouseleave)="closeMenu(menuTrigger)"-->



<mat-menu #tagsAndBranches="matMenu">
  <div>
    <!-- Show "Setup Remote" when no remote exists OR authentication failed -->
    <div *ngIf="!hasRemoteConfigured" (click)="openSetupRemote()"
         class="container setup-remote"
         mat-menu-item (click)="$event.stopPropagation()">
      <span>Setup GitHub Remote</span><span class="flexExpand"></span>
      <button mat-icon-button>
        <mat-icon style="text-align:right" color="warn">cloud_upload</mat-icon>
      </button>
    </div>
    <!-- Show "Manage Remote" ONLY when using app-stored credentials (NOT when using native Git) -->
    <div *ngIf="needsRemoteManagement && !isUsingNativeGit" (click)="openManageRemote()"
         class="container manage-remote"
         mat-menu-item (click)="$event.stopPropagation()">
      <span>Manage Remote</span><span class="flexExpand"></span>
      <button mat-icon-button>
        <mat-icon style="text-align:right">settings</mat-icon>
      </button>
    </div>
    <div (click)="openHistory()" class="container"
         mat-menu-item (click)="$event.stopPropagation()">
      <span>History</span><span class="flexExpand"></span>
      <button mat-icon-button>
        <mat-icon style="text-align:right">history</mat-icon>
      </button>
    </div>
    <div (click)="openBranchDialog()"
         class="container"
         mat-menu-item (click)="$event.stopPropagation()">
      <span>Branch</span><span class="flexExpand"></span>
      <button mat-icon-button>
        <mat-icon style="text-align:right">account_tree</mat-icon>
      </button>
    </div>
  </div>
</mat-menu>

<!-- Git Init Menu for non-Git projects -->
<mat-menu #gitInitMenu="matMenu">
  <div>
    <div (click)="openGitInitWizard()"
         class="container"
         mat-menu-item (click)="$event.stopPropagation()">
      <span>Inizializza Git</span><span class="flexExpand"></span>
      <button mat-icon-button>
        <mat-icon style="text-align:right" color="primary">add_circle</mat-icon>
      </button>
    </div>
  </div>
</mat-menu>
