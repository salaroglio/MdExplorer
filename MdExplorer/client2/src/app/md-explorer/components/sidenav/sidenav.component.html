

<mat-sidenav-container autosize fullscreen class="app-sidenav-container">

  <mat-sidenav #sidenav [style.width]="sideNavWidth" class=" mat-elevation-z10"
               [opened]="!isScreenSmall"
               [mode]="!isScreenSmall ? 'side':'over'"
               (openedChange)="onSidenavToggle($event)">

    <mat-toolbar color="primary">
      <div>
        <button mat-icon-button id="projectcss" class="btn-projects" [matTooltip]="'SIDENAV.PROJECTS_LIST' | translate" (click)="openProject()">
          <mat-icon>ballot</mat-icon>
        </button>
        <button mat-icon-button class="btn-reveal-in-tree" [matTooltip]="'SIDENAV.REVEAL_IN_TREE' | translate" (click)="revealInTree()" [disabled]="!hasCurrentFile()">
          <mat-icon>my_location</mat-icon>
        </button>
      </div>
      <!-- Toggle FileSystemWatcher -->
      <mat-slide-toggle
        [(ngModel)]="fileSystemWatcherEnabled"
        (change)="onFileSystemWatcherToggle()"
        color="accent"
        [matTooltip]="'SIDENAV.AUTO_RELOAD' | translate"
        class="fsw-toggle">
      </mat-slide-toggle>
      <span>{{titleProject}}</span>
      <span class="flexExpand"></span>
    </mat-toolbar>
    <mat-tab-group headerPosition="below" [(selectedIndex)]="selectedTabIndex" (selectedTabChange)="onTabChange($event)" style="justify-content: space-between; height: calc(100% - 64px);">
      <mat-tab style="height:100%">
        <ng-template mat-tab-label>
          <img src="/assets/project.png" style="height:24px" />
          {{ 'SIDENAV.PROJECT_DOCS' | translate }}
        </ng-template>
        <app-md-tree></app-md-tree>
      </mat-tab>
      <mat-tab *ngIf="currentBranch != null">
        <ng-template mat-tab-label>
          <mat-icon>smart_toy</mat-icon>
          {{ 'SIDENAV.MARK_AGENT' | translate }}
        </ng-template>
        <app-ai-chat [compactMode]="true"></app-ai-chat>
      </mat-tab>
      <mat-tab *ngIf="titleProject">
        <ng-template mat-tab-label>
          <mat-icon>manage_search</mat-icon>
          {{ 'SIDENAV.MARK_SEARCH' | translate }}
        </ng-template>
        <app-mark-search></app-mark-search>
      </mat-tab>
      <mat-tab *ngIf="teamChatEnabled && hasRemote">
        <ng-template mat-tab-label>
          <mat-icon>chat</mat-icon>
          {{ 'SIDENAV.TEAM_CHAT' | translate }}
        </ng-template>
        <app-git-chat></app-git-chat>
      </mat-tab>
    </mat-tab-group>

  </mat-sidenav>

  <mat-sidenav-content class="flex-container">
    <!-- Overlay for capturing mouse events during drag -->
    <div class="drag-overlay"
         *ngIf="!isChatFullScreen"
         [class.active]="hooked">
    </div>

    <div class="resize-handle"
         *ngIf="!isChatFullScreen"
         [class.dragging]="hooked"
         (pointerdown)="resizeWidth()"
         (mouseup)="stopResizeWidth()"
         role="separator"
         aria-label="Ridimensiona pannello di navigazione"
         aria-orientation="vertical"
         title="Trascina per ridimensionare">
    </div>

    <!-- Wrapper div per router-outlet che caricherà DocumentShowComponent -->
    <div class="router-outlet-wrapper" [class.hidden]="isChatFullScreen" [style.display]="embeddedAppActive ? 'none' : ''">
      <router-outlet></router-outlet>
    </div>

    <!-- Persistent embedded app container — iframes survive navigation -->
    <app-app-show [style.display]="embeddedAppActive ? '' : 'none'"></app-app-show>
  </mat-sidenav-content>

</mat-sidenav-container>
